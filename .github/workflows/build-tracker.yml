name: Validate and build K-Beauty Tracker

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'main.tsx'
      - 'scripts/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/build-tracker.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tracker-build-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate datasets and source evidence
        run: |
          python3 scripts/validate-update.py
          node scripts/test-trade-series.mjs
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Build static site
        run: npm run build
      - name: Commit rebuilt GitHub Pages files
        run: |
          if [ -n "$(git status --porcelain -- docs)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A docs
            git commit -m "Build GitHub Pages from validated tracker data [skip ci]"
            git push
          else
            echo "Built output unchanged"
          fi
